name: Lender network metrics

on:
  pull_request:
  push:
    branches: [main]

jobs:
  stale-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fail if publication catalogs diverge from the checked-in manifest
        run: node scripts/assert_network_metrics_v1.mjs
      - name: Homepage consumes v1
        run: node scripts/assert_homepage_intel.mjs
      - name: Reproduce accepted metrics and reconcile source grains
        run: npm run check:metrics-r2-03
      - name: Grain-safety unit tests
        run: npx --yes tsx --test scripts/test_lender_network_metrics.ts
      - name: Exact NMLS and LEI request integrity
        run: npm run check:th-search-r1-002
      - name: State HMDA count scope and measure integrity
        run: npm run check:th-search-r1-003

      - name: Institution-volume availability regression
        run: npm run check:th-search-r1-004

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VISUAL-004 — Old Lender vs New Lender</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #0A2540; background: #F8FAFC; }
    body { margin: 24px; }
    h1 { font-size: 28px; }
    h2 { font-size: 18px; margin: 32px 0 12px; }
    p { color: #1E293B; max-width: 920px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    figure { margin: 0; background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; overflow: hidden; }
    figcaption { padding: 10px 12px; font-size: 13px; font-weight: 600; border-top: 1px solid #E2E8F0; }
    img { display: block; width: 100%; }
  </style>
</head>
<body>
  <h1>OLD LENDER vs NEW LENDER</h1>
  <p>
    VISUAL-004 network shell. Stacked Ask Network bar removed. Canonical mark.
    Inter chrome. One Switch Hub. My Lending preserved as a 44px control.
  </p>

  <h2>Desktop 1440 — header</h2>
  <div class="grid">
    <figure>
      <img src="before/header-desktop.png" alt="Old Lender stacked chrome" />
      <figcaption>OLD — 57px network bar + 65px product header = 122px stacked</figcaption>
    </figure>
    <figure>
      <img src="after/header-desktop.png" alt="New Lender desktop header" />
      <figcaption>NEW — 69px one row, 36px mark, My Lending + Switch Hub 44px</figcaption>
    </figure>
  </div>

  <h2>Desktop 1440 — homepage</h2>
  <div class="grid">
    <figure>
      <img src="before/desktop-1440.jpg" alt="Old Lender desktop homepage" />
      <figcaption>OLD LENDER · 1440</figcaption>
    </figure>
    <figure>
      <img src="after/desktop-1440.jpg" alt="New Lender desktop homepage" />
      <figcaption>NEW LENDER · 1440</figcaption>
    </figure>
  </div>

  <h2>Desktop 1440 — Network Navigator open</h2>
  <figure>
    <img src="after/desktop-switch.jpg" alt="New Lender Switch Hub open" />
    <figcaption>NEW — ASK TRUST HUB NETWORK · Lender Current</figcaption>
  </figure>

  <h2>Mobile 390</h2>
  <div class="grid">
    <figure>
      <img src="before/header-mobile.png" alt="Old Lender mobile header" />
      <figcaption>OLD — stacked bar + product header</figcaption>
    </figure>
    <figure>
      <img src="after/header-mobile.png" alt="New Lender mobile header" />
      <figcaption>NEW — 57px, 30px mark, My Lending + Menu 44×44</figcaption>
    </figure>
  </div>
  <div class="grid">
    <figure>
      <img src="before/mobile-390.jpg" alt="Old Lender mobile homepage" />
      <figcaption>OLD LENDER · 390</figcaption>
    </figure>
    <figure>
      <img src="after/mobile-390.jpg" alt="New Lender mobile homepage" />
      <figcaption>NEW LENDER · 390</figcaption>
    </figure>
  </div>

  <h2>Mobile drawer and network</h2>
  <div class="grid">
    <figure>
      <img src="after/mobile-drawer.jpg" alt="New Lender mobile drawer" />
      <figcaption>NEW drawer — Lender nav + workspace</figcaption>
    </figure>
    <figure>
      <img src="after/mobile-network.jpg" alt="New Lender network section" />
      <figcaption>NEW network section — Ask→Investor order, Current</figcaption>
    </figure>
  </div>
</body>
</html>
